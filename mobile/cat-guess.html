<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-kuaile/index.css" rel="stylesheet">
<title>猫猫猜数字 🐱</title>
<style>
:root{
  --bg: #F3EDE8;
  --bg-warm: #FAF4EE;
  --pink: #D4A5A5;
  --pink-deep: #B57E7E;
  --pink-soft: #E8D5D5;
  --green: #A3B899;
  --green-deep: #708A66;
  --green-soft: #C8D5C4;
  --purple-bow: #9B8AA5;
  --purple-deep: #786882;
  --ink: #5E5252;
  --ink-soft: #7D7070;
  --paper: #FFFDF9;
  --line: #D8CCC4;
  --accent: #708A66;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background: radial-gradient(circle at 50% 30%, #FFFDF9 0%, #FAF4EE 60%, #F1E7DF 100%);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
.paws{position:fixed;inset:0;pointer-events:none;opacity:.08;font-size:32px;overflow:hidden;z-index:0}
.paws span{position:absolute;animation:drift linear infinite}
@keyframes drift{
  0%{transform:translateY(12vh) rotate(-14deg);opacity:0}
  12%{opacity:.9}
  85%{opacity:.5}
  100%{transform:translateY(-110vh) rotate(16deg);opacity:0}
}
.app{position:relative;z-index:1;width:min(94vw,480px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0}
header{display:flex;align-items:center;gap:12px}
header h1{font-size:24px;font-weight:900;letter-spacing:2px;color:var(--green-deep)}
.round-tag{
  font-size:12px;color:var(--pink-deep);background:var(--paper);border:1.5px solid var(--pink-soft);
  padding:4px 12px;border-radius:999px;font-weight:800
}
.card{
  width:100%;background:var(--paper);border:2px solid var(--line);border-radius:24px;
  box-shadow:0 16px 36px rgba(107,94,94,.12), 0 4px 0 #E2D7CF;
  padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px
}
/* ===== 聊天区 ===== */
.chat{display:flex;align-items:flex-end;gap:10px}
.cat-side{width:96px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.cat-head{width:88px;height:auto;filter:drop-shadow(0 8px 14px rgba(107,94,94,.18))}
.cat-name{font-size:11px;font-weight:800;color:var(--green-deep);margin-top:4px;letter-spacing:1.5px}
.bubble{
  flex:1;position:relative;background:#FAF4EE;border:2px solid var(--line);
  border-radius:18px 18px 18px 4px;padding:13px 15px;min-height:64px;
  font-size:15px;line-height:1.55;font-weight:600;color:var(--ink);
  box-shadow:0 3px 0 #E2D7CF;display:flex;align-items:center;
  transition:transform .15s
}
.bubble::before{
  content:"";position:absolute;left:-14px;bottom:14px;
  border:8px solid transparent;border-right-color:var(--line);border-left-width:0
}
.bubble::after{
  content:"";position:absolute;left:-9px;bottom:16px;
  border:6px solid transparent;border-right-color:#FAF4EE;border-left-width:0
}
.bubble.bounce{animation:bounce .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bounce{0%{transform:scale(.94) translateY(2px)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.bubble.big{font-size:16px;font-weight:800}
/* ===== 已猜次数 ===== */
.attempts{text-align:center;font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:1px}
.attempts b{color:var(--green-deep);font-size:17px}
/* ===== 输入区 ===== */
.input-row{display:flex;gap:10px}
.input-row input{
  flex:1;border:2px solid var(--line);background:var(--paper);border-radius:16px;
  padding:12px 16px;font-size:17px;font-weight:800;color:var(--ink);
  outline:none;box-shadow:0 3px 0 #E2D7CF;transition:border-color .15s
}
.input-row input:focus{border-color:var(--green-deep);border-bottom-width:2px}
.input-row input:disabled{background:#EFEAE4;color:#B5A8A0}
.btn{
  border:none;border-radius:16px;padding:12px 24px;font-size:16.5px;font-weight:900;
  cursor:pointer;color:#fff;letter-spacing:2px;
  background:linear-gradient(180deg,#8FA685,#708A66);
  box-shadow:0 4px 0 #566D4E, 0 8px 16px rgba(112,138,102,.30);
  transition:transform .08s, box-shadow .08s
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #566D4E}
.btn.green{
  background:linear-gradient(180deg,#D4A5A5,#B57E7E);
  box-shadow:0 4px 0 #946060, 0 8px 16px rgba(181,126,126,.30)
}
.btn.green:active{box-shadow:0 1px 0 #946060}
.hidden{display:none !important}
/* ===== 历史 ===== */
.history{display:flex;flex-wrap:wrap;gap:7px;min-height:30px;max-height:80px;overflow-y:auto;align-content:flex-start;padding:2px 0}
.history::-webkit-scrollbar{width:4px}
.history::-webkit-scrollbar-thumb{background:#D8CCC4;border-radius:4px}
.hist-chip{
  font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;
  background:#FAF4EE;border:1.5px solid var(--line);color:var(--ink);
  animation:chipIn .25s cubic-bezier(.34,1.56,.64,1)
}
.hist-chip .dir{font-weight:900}
.hist-chip.up{border-color:var(--green-soft);background:#EDF4EB}
.hist-chip.up .dir{color:var(--green-deep)}
.hist-chip.down{border-color:var(--pink-soft);background:#F9EFEF}
.hist-chip.down .dir{color:var(--pink-deep)}
.hist-chip.win{border-color:#D4C4A8;background:#FFF9ED}
@keyframes chipIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.hint{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-align:center}
.keypad-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;
}
.k-btn{
  border:1.5px solid var(--line);background:#FFFDF9;border-radius:10px;
  padding:8px 0;font-size:16px;font-weight:900;color:var(--ink);
  box-shadow:0 2px 0 #D8CCC4;font-family:inherit;cursor:pointer;
  transition:all .1s ease;
}
.k-btn:active{transform:translateY(2px);box-shadow:0 0 0 #D8CCC4;background:#FAF4EE}
.k-btn.k-del{background:#FBF0F0;color:var(--pink-deep);border-color:var(--pink-soft)}
.k-btn.k-sub{background:#EDF4EB;color:var(--green-deep);border-color:var(--green-soft)}
/* 返回大厅按钮 */
.back-home-badge{
  position:fixed;top:12px;left:12px;z-index:50;
  background:var(--paper);border:1.5px solid var(--green-soft);border-radius:999px;
  padding:5px 14px;font-size:13px;font-weight:800;color:var(--green-deep);
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  box-shadow:0 3px 0 #D5DFD2;transition:transform .12s, box-shadow .12s;
}
.back-home-badge:hover{transform:translateY(-2px);box-shadow:0 5px 0 #D5DFD2}
.back-home-badge:active{transform:translateY(1px);box-shadow:0 1px 0 #D5DFD2}
</style>
</head>
<body>
<a class="back-home-badge" href="index.html" title="返回猫猫游戏屋大厅">🐾 大厅</a>
<div class="paws" id="paws"></div>

<div class="app">
  <header>
    <h1>🐱 猫猫猜数字</h1>
    <div class="round-tag" id="roundTag">第 1 局</div>
  </header>

  <div class="card">
    <div class="chat">
      <div class="cat-side">
        <!-- ============ 原版白猫头像 (紫色蝴蝶结 + 夸张长睫毛 + 星星眼) ============ -->
        <svg class="cat-head" viewBox="0 0 110 115" aria-label="原版白猫头像">
          <!-- 头部与猫耳 -->
          <circle cx="55" cy="62" r="38" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5"/>
          <path d="M30,42 L40,8 L62,28 Z" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M80,42 L70,8 L48,28 Z" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M36,36 L42,17 L56,29 Z" fill="#F4DFE4"/>
          <path d="M74,36 L68,17 L54,29 Z" fill="#F4DFE4"/>
          <!-- 紫色大蝴蝶结 + 珍珠中心 -->
          <g transform="translate(55, 18)">
            <path d="M-2,0 C-15,-8 -26,-3 -26,6 C-26,14 -13,10 -2,0" fill="#9B8AA5" stroke="#786882" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M2,0 C15,-8 26,-3 26,6 C26,14 13,10 2,0" fill="#9B8AA5" stroke="#786882" stroke-width="2.5" stroke-linejoin="round"/>
            <circle r="5.5" fill="#FFFDF9" stroke="#D4C4A8" stroke-width="1.8"/>
            <circle cx="-1.5" cy="-1.5" r="1.5" fill="#FFF"/>
          </g>
          <!-- 灵动双眼与八角星辉 -->
          <ellipse cx="40" cy="62" rx="10" ry="11" fill="#433B4A"/>
          <ellipse cx="70" cy="62" rx="10" ry="11" fill="#433B4A"/>
          <circle cx="43" cy="58" r="3.4" fill="#FFFDF9"/>
          <circle cx="73" cy="58" r="3.4" fill="#FFFDF9"/>
          <g style="transform-box:fill-box;transform-origin:center;animation:orbFloat 2.4s ease-in-out infinite;">
            <polygon points="40,61 42,65 46,66 43,68 44,72 40,70 36,72 37,68 34,66 38,65" fill="#FDF3D8"/>
            <polygon points="70,61 72,65 76,66 73,68 74,72 70,70 66,72 67,68 64,66 68,65" fill="#FDF3D8"/>
          </g>
          <!-- 夸张上翘浓密睫毛 -->
          <path d="M30,55 Q33,44 26,39 M40,51 Q42,40 42,35 M49,56 Q52,46 57,41" stroke="#5E5252" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M80,55 Q77,44 84,39 M70,51 Q68,40 68,35 M61,56 Q58,46 53,41" stroke="#5E5252" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- 腮红、鼻吻与三瓣嘴 -->
          <circle cx="26" cy="78" r="7" fill="#F0CDD5" opacity="0.65"/>
          <circle cx="84" cy="78" r="7" fill="#F0CDD5" opacity="0.65"/>
          <path d="M55,74 l4,4 l-8,0 Z" fill="#E8A6B6"/>
          <path d="M48,80 q7,5 14,0" stroke="#CFBEB8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="cat-name">灵猫珠珠</div>
      </div>
      <div class="bubble" id="bubble">我在想一个 <b>1~100</b> 之间的数字，快来猜猜看喵~ 🐾</div>
    </div>

    <div class="input-row">
      <input id="guessInput" type="number" inputmode="numeric" min="1" max="100" placeholder="输入 1~100" readonly style="cursor:pointer;">
      <button class="btn" id="guessBtn">猜！</button>
      <button class="btn green hidden" id="againBtn">再来一局 🎉</button>
    </div>

    <!-- 手机端专属：手账九宫格软键盘 (免调起系统键盘遮挡) -->
    <div class="keypad-grid" id="keypadGrid">
      <button class="k-btn" data-key="1">1</button>
      <button class="k-btn" data-key="2">2</button>
      <button class="k-btn" data-key="3">3</button>
      <button class="k-btn" data-key="4">4</button>
      <button class="k-btn" data-key="5">5</button>
      <button class="k-btn" data-key="6">6</button>
      <button class="k-btn" data-key="7">7</button>
      <button class="k-btn" data-key="8">8</button>
      <button class="k-btn" data-key="9">9</button>
      <button class="k-btn k-del" id="keyClear">C</button>
      <button class="k-btn" data-key="0">0</button>
      <button class="k-btn k-sub" id="keySubmit">✓</button>
    </div>

    <div class="history" id="history"></div>
    <div class="hint">小提示：猫猫会告诉你猜高了还是低了，慢慢缩小范围吧</div>
  </div>
</div>

<script>
"use strict";
/* ================= 元素 ================= */
const $ = id => document.getElementById(id);
const bubble = $("bubble"), input = $("guessInput");
const guessBtn = $("guessBtn"), againBtn = $("againBtn");
const attemptsEl = $("attempts"), historyEl = $("history"), roundTag = $("roundTag");
const FACES = ["faceNormal","faceThink","faceHappy","faceSad"];

/* ================= 游戏状态 ================= */
let target = 0, attempts = 0, round = 1, won = false;

function newGame(){
  target = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  won = false;
  attemptsEl.textContent = "0";
  historyEl.innerHTML = "";
  input.disabled = false;
  input.value = "";
  guessBtn.classList.remove("hidden");
  againBtn.classList.add("hidden");
  setFace("normal");
  say("我在想一个 <b>1~100</b> 之间的数字，快来猜猜看吧！");
  input.focus();
}

function say(html, big){
  bubble.innerHTML = html;
  bubble.classList.toggle("big", !!big);
  bubble.classList.remove("bounce");
  void bubble.offsetWidth;
  bubble.classList.add("bounce");
}

function setFace(level){
  FACES.forEach((id,i)=>{ 
    const el = $(id);
    if(el) el.style.display = i === level ? "" : "none"; 
  });
}

/* ================= 音效（合成喵叫） ================= */
let AC = null;
function ensureAC(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function meow(pitch=1){
  try{
    const a = ensureAC();
    if(a.state === "suspended") a.resume();
    const t = a.currentTime;
    const o1 = a.createOscillator(); o1.type = "sine";
    o1.frequency.setValueAtTime((500+Math.random()*70)*pitch, t);
    o1.frequency.exponentialRampToValueAtTime(250*pitch, t+0.11);
    const g1 = a.createGain();
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.exponentialRampToValueAtTime(0.4, t+0.02);
    g1.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
    o1.connect(g1).connect(a.destination);
    o1.start(t); o1.stop(t+0.18);
  }catch(e){}
}
function chime(){
  try{
    const a = ensureAC(); const t = a.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>{
      const o = a.createOscillator(); o.type = "sine"; o.frequency.value = f;
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t+i*0.08);
      g.gain.exponentialRampToValueAtTime(0.22, t+i*0.08+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.08+0.5);
      o.connect(g).connect(a.destination);
      o.start(t+i*0.08); o.stop(t+i*0.08+0.55);
    });
  }catch(e){}
}

/* ================= 猜测逻辑 ================= */
function addChip(num, dir){
  const chip = document.createElement("span");
  chip.className = "hist-chip " + dir;
  const arrow = dir === "up" ? "↑" : dir === "down" ? "↓" : "✓";
  chip.innerHTML = `<b>${num}</b> <span class="dir">${arrow}</span>`;
  historyEl.appendChild(chip);
  historyEl.scrollTop = historyEl.scrollHeight;
}

function guess(){
  if(won) return;
  const raw = input.value.trim();
  if(raw === ""){ setFace("think"); say("还没输入数字呢，快猜一个吧，喵？"); input.focus(); return; }
  const n = Number(raw);
  if(!Number.isInteger(n) || n < 1 || n > 100){
    setFace("think");
    say("哎呀，数字要在 <b>1~100</b> 之间哦，重新输入试试～");
    input.value = "";
    input.focus();
    return;
  }
  attempts++;
  attemptsEl.textContent = attempts;
  meow(1 + Math.min(attempts, 10) * 0.03);

  if(n === target){
    won = true;
    setFace("happy");
    say(`🎉 哇！恭喜你完全猜对啦！<br>答案就是 <b>${target}</b>，你一共猜了 <b>${attempts}</b> 次！`, true);
    addChip(n, "win");
    chime();
    meow(1.3);
    input.disabled = true;
    guessBtn.classList.add("hidden");
    againBtn.classList.remove("hidden");
  }else if(n > target){
    setFace("think");
    say(`<b>${n}</b> 太大啦！小猫摇摇头：再猜小一点试试～`);
    addChip(n, "down");
    input.value = "";
    input.focus();
  }else{
    setFace("think");
    say(`<b>${n}</b> 太小啦！小猫眨眨眼：再猜大一点试试～`);
    addChip(n, "up");
    input.value = "";
    input.focus();
  }
}

/* ================= 事件 ================= */
guessBtn.addEventListener("click", guess);
input.addEventListener("keydown", e => { if(e.key === "Enter") guess(); });
againBtn.addEventListener("click", ()=>{
  round++;
  roundTag.textContent = `第 ${round} 局`;
  newGame();
});

// 手机九宫格软键盘按键
document.querySelectorAll(".k-btn[data-key]").forEach(btn => {
  btn.addEventListener("click", () => {
    if(won) return;
    if(input.value.length < 3) {
      input.value += btn.dataset.key;
      meow(1.2);
    }
  });
});
const keyClear = $("keyClear"), keySubmit = $("keySubmit");
if(keyClear) {
  keyClear.addEventListener("click", () => {
    if(won) return;
    input.value = "";
  });
}
if(keySubmit) {
  keySubmit.addEventListener("click", guess);
}

/* ================= 背景猫爪 ================= */
(function(){
  const paws = $("paws");
  for(let i=0;i<14;i++){
    const s = document.createElement("span");
    s.textContent = ["🐾","🐾","🐱","🎲"][i % 4];
    s.style.left = Math.random()*100+"vw";
    s.style.top = Math.random()*100+"vh";
    s.style.animationDuration = (15+Math.random()*18)+"s";
    s.style.animationDelay = (Math.random()*14)+"s";
    s.style.fontSize = (16+Math.random()*20)+"px";
    paws.appendChild(s);
  }
})();

/* ================= 启动 ================= */
newGame();
</script>
</body>
</html>
