<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-kuaile/index.css" rel="stylesheet">
<title>猫猫运势 · 塔罗牌 🔮</title>
<style>
:root{
  --gold:#d4af37; --gold-light:#f5d061; --purple-deep:#241040; --purple-mid:#3a1c63;
  --ink:#fdf6ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(1200px 820px at 50% -18%, #6b3fa0, #3a1c63 55%, #241040);
  color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
  display:flex;align-items:center;justify-content:center;
}
.scene{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
/* 背景金星 */
.twinkle{position:absolute;color:var(--gold-light);pointer-events:none;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7) rotate(0)}50%{opacity:.9;transform:scale(1.15) rotate(28deg)}}
/* 标题 */
header{text-align:center;position:relative;z-index:5}
header h1{
  font-size:30px;font-weight:900;letter-spacing:4px;
  color:var(--gold-light);text-shadow:0 0 18px rgba(245,208,97,.55), 0 4px 0 rgba(0,0,0,.25)
}
header .sub{font-size:12.5px;color:#c9a5f0;letter-spacing:6px;font-weight:700;margin-top:5px}
/* 主体 */
.main{display:flex;align-items:center;justify-content:center;gap:30px;position:relative;z-index:5}
/* 猫猫 */
.cat-side{display:flex;flex-direction:column;align-items:center;gap:10px;width:132px;flex-shrink:0}
.cat-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.bubble{
  position:relative;background:rgba(255,255,255,.1);border:1.5px solid rgba(245,208,97,.5);
  border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:13px;line-height:1.5;
  color:#f3e6ff;font-weight:600;min-height:58px;backdrop-filter:blur(4px);
  box-shadow:0 8px 24px rgba(0,0,0,.3)
}
.bubble::after{content:"";position:absolute;left:20px;bottom:-9px;
  border:5px solid transparent;border-top-color:rgba(245,208,97,.5)}
.bubble.bounce{animation:bounce .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bounce{0%{transform:scale(.93) translateY(2px)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
/* 牌 3D */
.card-3d{width:200px;height:300px;perspective:1000px;cursor:pointer;position:relative;z-index:6;
  transition:transform .25s;filter:drop-shadow(0 22px 40px rgba(0,0,0,.5))}
.card-3d.drawing{transform:scale(1.05)}
.card-3d.shake{animation:shakeX .45s}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.card-inner{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.45,.05,.2,1)
}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{
  position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;overflow:hidden;
}
/* 牌背：紫底金星 */
.card-back{
  background:linear-gradient(155deg,#6d35a8 0%,#4a1f7d 45%,#32135c 100%);
  border:3px solid var(--gold);box-shadow:inset 0 0 0 4px rgba(245,208,97,.28);
  display:flex;align-items:center;justify-content:center;
}
.card-back .big-star{font-size:66px;color:var(--gold-light);text-shadow:0 0 22px rgba(245,208,97,.8);animation:starGlow 2.6s ease-in-out infinite}
@keyframes starGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(245,208,97,.7));transform:scale(1)}50%{filter:drop-shadow(0 0 20px rgba(245,208,97,1));transform:scale(1.08)}}
.card-back .corner{position:absolute;font-size:15px;color:rgba(245,208,97,.75)}
.card-back .c1{top:10px;left:13px}.card-back .c2{top:10px;right:13px}
.card-back .c3{bottom:10px;left:13px}.card-back .c4{bottom:10px;right:13px}
/* 牌正面 */
.card-front{
  transform:rotateY(180deg);background:linear-gradient(165deg,#fff8e6 0%,#fbeecb 55%,#f3dd9e 100%);
  border:3px solid var(--gold);color:#4a2a63;
  display:flex;flex-direction:column;padding:14px 13px 12px;
}
.f-top{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;
  letter-spacing:2px;font-weight:800;color:#9a7b2d}
.f-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.f-sym{font-size:46px;line-height:1;margin-bottom:2px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.f-name{font-size:25px;font-weight:900;letter-spacing:3px;color:#5b2d8f}
.f-en{font-size:10px;font-weight:700;color:#a5842f;letter-spacing:1.5px}
.f-text{
  font-size:11.5px;line-height:1.65;font-weight:700;color:#5a3a78;
  background:rgba(212,175,55,.13);border:1px dashed rgba(212,175,55,.55);
  border-radius:10px;padding:8px 9px;min-height:56px
}
/* 按钮 */
.btn{
  border:none;border-radius:999px;padding:14px 38px;font-size:17px;font-weight:900;
  letter-spacing:3px;color:#3a1c63;cursor:pointer;
  background:linear-gradient(180deg,#ffe08a,#e8b94a);
  box-shadow:0 6px 0 #a87f1f, 0 14px 30px rgba(0,0,0,.35), 0 0 24px rgba(245,208,97,.35);
  transition:transform .08s, box-shadow .08s;position:relative;z-index:5
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a87f1f}
.daily-note{font-size:11.5px;color:#a98fd0;font-weight:700;letter-spacing:2px;position:relative;z-index:5}
/* 翻牌金星粒子 */
.spark{
  position:fixed;color:var(--gold-light);pointer-events:none;z-index:60;
  animation:sparkFly .85s ease-out forwards;text-shadow:0 0 10px rgba(245,208,97,.9)
}
@keyframes sparkFly{
  from{transform:translate(0,0) scale(1) rotate(0);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(.15) rotate(120deg);opacity:0}
}
/* 手机适配 */
@media (max-width:560px){
  .main{gap:14px}
  .card-3d{width:150px;height:225px}
  .cat-side{width:104px}
  .cat-emoji{font-size:40px}
  .bubble{font-size:12px;min-height:64px}
  .f-sym{font-size:36px}.f-name{font-size:20px}
  .f-text{font-size:10.5px;padding:7px}
  header h1{font-size:24px}
}
/* 返回大厅星象挂牌 */
.back-home-badge{
  position:fixed;top:14px;left:14px;z-index:60;
  background:rgba(58,28,99,.7);border:1.5px solid rgba(245,208,97,.6);border-radius:999px;
  padding:6px 14px;font-size:13.5px;font-weight:800;color:var(--gold-light);
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.3);transition:all .15s ease;
}
.back-home-badge:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(245,208,97,.35);}
.back-home-badge:active{transform:translateY(1px);box-shadow:0 2px 6px rgba(0,0,0,.3);}
</style>
</head>
<body>
<a class="back-home-badge" href="index.html" title="返回猫猫游戏屋大厅">🏡 大厅</a>
<div class="scene">
  <header>
    <h1>🔮 猫猫运势</h1>
    <div class="sub">喵 喵 塔 罗 · 每 日 一 摇</div>
  </header>

  <div class="main">
    <!-- 原版白猫 -->
    <div class="cat-side">
      <div class="bubble" id="bubble">喵~ 今天要看看你的运势吗？</div>
      <div style="width:88px;height:120px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));">
        <svg viewBox="0 0 110 165" style="width:100%;height:100%;">
          <path d="M88,136 C108,134 114,120 110,105 C107,96 98,93 92,100" fill="none" stroke="#D1C3BE" stroke-width="6.5" stroke-linecap="round"/>
          <ellipse cx="55" cy="132" rx="36" ry="28" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5"/>
          <ellipse cx="38" cy="151" rx="9.5" ry="7" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5"/>
          <ellipse cx="72" cy="151" rx="9.5" ry="7" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5"/>
          <circle cx="55" cy="72" r="38" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5"/>
          <path d="M30,52 L40,18 L62,38 Z" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M80,52 L70,18 L48,38 Z" fill="#FFFDF9" stroke="#CFBEB8" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M36,46 L42,27 L56,39 Z" fill="#F4DFE4"/>
          <path d="M74,46 L68,27 L54,39 Z" fill="#F4DFE4"/>
          <g transform="translate(55, 27)">
            <path d="M-2,0 C-15,-8 -26,-3 -26,6 C-26,14 -13,10 -2,0" fill="#9B8AA5" stroke="#786882" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M2,0 C15,-8 26,-3 26,6 C26,14 13,10 2,0" fill="#9B8AA5" stroke="#786882" stroke-width="2.5" stroke-linejoin="round"/>
            <circle r="5.5" fill="#FFFDF9" stroke="#D4C4A8" stroke-width="1.8"/>
            <circle cx="-1.5" cy="-1.5" r="1.5" fill="#FFF"/>
          </g>
          <ellipse cx="40" cy="72" rx="10" ry="11" fill="#433B4A"/>
          <ellipse cx="70" cy="72" rx="10" ry="11" fill="#433B4A"/>
          <circle cx="43" cy="68" r="3.4" fill="#FFFDF9"/>
          <circle cx="73" cy="68" r="3.4" fill="#FFFDF9"/>
          <g style="transform-box:fill-box;transform-origin:center;animation:orbFloat 2.4s ease-in-out infinite;">
            <polygon points="40,71 42,75 46,76 43,78 44,82 40,80 36,82 37,78 34,76 38,75" fill="#FDF3D8"/>
            <polygon points="70,71 72,75 76,76 73,78 74,82 70,80 66,82 67,78 64,76 68,75" fill="#FDF3D8"/>
          </g>
          <path d="M30,65 Q33,54 26,49 M40,61 Q42,50 42,45 M49,66 Q52,56 57,51" stroke="#5E5252" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M80,65 Q77,54 84,49 M70,61 Q68,50 68,45 M61,66 Q58,56 53,51" stroke="#5E5252" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="26" cy="88" r="7" fill="#F0CDD5" opacity="0.65"/>
          <circle cx="84" cy="88" r="7" fill="#F0CDD5" opacity="0.65"/>
          <path d="M55,84 l4,4 l-8,0 Z" fill="#E8A6B6"/>
          <path d="M48,90 q7,5 14,0" stroke="#CFBEB8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <!-- 塔罗牌 -->
    <div class="card-3d" id="card3d">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-back">
          <span class="big-star">✦</span>
          <span class="corner c1">✦</span><span class="corner c2">✦</span>
          <span class="corner c3">✦</span><span class="corner c4">✦</span>
        </div>
        <div class="card-face card-front">
          <div class="f-top"><span>✦</span>喵喵塔罗<span>✦</span></div>
          <div class="f-body">
            <div class="f-sym" id="fSym">🃏</div>
            <div class="f-name" id="fName">命运</div>
            <div class="f-en" id="fEn">The Fortune</div>
          </div>
          <div class="f-text" id="fText">🐱 本喵觉得，今天会有好运降临！</div>
        </div>
      </div>
    </div>
  </div>

  <button class="btn" id="shakeBtn">摇一摇运势 🔮</button>
  <div class="daily-note">每日限摇一次 · 次日 0 点刷新</div>
</div>

<script>
"use strict";
/* ================= 牌数据 ================= */
const CARDS = [
  { name:"愚者",   en:"The Fool",          sym:"🃏", text:"今天适合大胆尝试新事物，像本喵追逗猫棒一样，冲就完事了！" },
  { name:"魔术师", en:"The Magician",      sym:"✨", text:"今天你能量满格，想做的事都能搞定，记得像本喵一样自信舔爪！" },
  { name:"女祭司", en:"The High Priestess",sym:"🌙", text:"今天适合静下心来听听内心的声音，就像本喵安静盯窗外那样。" },
  { name:"命运之轮", en:"Wheel of Fortune",sym:"🎡", text:"好运正在转动，抓住机会喵，今天会有惊喜悄悄上门！" },
  { name:"星星",   en:"The Star",          sym:"⭐", text:"希望的星光正照着你，许个愿吧，本喵帮你盯着小鱼干。" },
  { name:"月亮",   en:"The Moon",          sym:"🌕", text:"今天情绪有点起伏也没关系，睡一觉，明天太阳照样升起！" },
];

/* ================= 元素 ================= */
const $ = id => document.getElementById(id);
const card3d = $("card3d"), cardInner = $("cardInner"), shakeBtn = $("shakeBtn");
const bubble = $("bubble"), fSym = $("fSym"), fName = $("fName"), fEn = $("fEn"), fText = $("fText");

/* ================= 每日限制（localStorage） ================= */
const KEY = "cat-tarot";
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ return {}; }
}
function save(data){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ /* file:// 下禁用存储时忽略 */ }
}
let state = load();
let isToday = state.date === todayStr();
let drawn = isToday && typeof state.card === "number";

/* ================= 音效（合成） ================= */
let AC = null;
function ensureAC(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function blip(freq, dur, vol, type){
  try{
    const a = ensureAC();
    if(a.state === "suspended") a.resume();
    const t = a.currentTime;
    const o = a.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function drawSound(){ blip(392,.16,.3); setTimeout(()=>blip(523,.18,.32),110); setTimeout(()=>blip(659,.3,.3,"triangle"),230); }
function refuseSound(){ blip(247,.22,.28); setTimeout(()=>blip(208,.28,.26),150); }

/* ================= 翻牌 ================= */
function say(html){
  bubble.innerHTML = html;
  bubble.classList.remove("bounce"); void bubble.offsetWidth;
  bubble.classList.add("bounce");
}
function showCard(i){
  const c = CARDS[i];
  fSym.textContent = c.sym;
  fName.textContent = c.name;
  fEn.textContent = c.en;
  fText.innerHTML = `🐱 本喵觉得，${c.text}`;
}
function flip(delay){
  if(delay){ cardInner.style.transition = "transform .01s"; cardInner.classList.remove("flipped"); void cardInner.offsetWidth;
    cardInner.style.transition = ""; }
  requestAnimationFrame(()=>requestAnimationFrame(()=>cardInner.classList.add("flipped")));
}
/* 金色粒子从牌中心散开 */
function sparkBurst(){
  const r = card3d.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<16;i++){
    const s = document.createElement("span");
    s.className = "spark"; s.textContent = "✦";
    s.style.left = cx+"px"; s.style.top = cy+"px";
    s.style.fontSize = (10 + Math.random()*14)+"px";
    const a = Math.random()*6.283, d = 50 + Math.random()*130;
    s.style.setProperty("--dx", Math.cos(a)*d+"px");
    s.style.setProperty("--dy", Math.sin(a)*d+"px");
    s.style.animationDelay = (Math.random()*0.12)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1400);
  }
}

/* ================= 摇牌流程 ================= */
function drawCard(){
  if(isToday){
    refuse();
    return;
  }
  // 抽牌
  const idx = Math.floor(Math.random()*CARDS.length);
  isToday = true;
  drawn = true;
  state = { date: todayStr(), card: idx };
  save(state);
  showCard(idx);
  card3d.classList.remove("shake");
  card3d.classList.add("drawing");
  drawSound();
  flip(true);
  say("喵！让我看看……<br>这就是你今天的运势！");
  setTimeout(()=>{ sparkBurst(); card3d.classList.remove("drawing"); }, 420);
  shakeBtn.textContent = "再摇一次 🔮";
}
function refuse(){
  card3d.classList.remove("shake"); void card3d.offsetWidth; card3d.classList.add("shake");
  refuseSound();
  say("今天你已经看过运势啦，<br>明天再来吧~");
}

/* ================= 事件 ================= */
shakeBtn.addEventListener("click", drawCard);
card3d.addEventListener("click", ()=>{
  if(!drawn) drawCard(); else refuse();
});

/* ================= 背景金星 ================= */
(function(){
  for(let i=0;i<26;i++){
    const s = document.createElement("span");
    s.className = "twinkle"; s.textContent = ["✦","✧","★"][i%3];
    s.style.left = Math.random()*100+"vw";
    s.style.top = Math.random()*100+"vh";
    s.style.fontSize = (8 + Math.random()*14)+"px";
    s.style.animationDelay = (Math.random()*3.4)+"s";
    document.body.appendChild(s);
  }
})();

/* ================= 启动 ================= */
if(drawn){
  // 今天已摇过：直接显示今天的牌
  showCard(state.card);
  flip(true);
  say("今天你已经看过运势啦，<br>明天再来吧~");
  shakeBtn.textContent = "再摇一次 🔮";
}
</script>
</body>
</html>
