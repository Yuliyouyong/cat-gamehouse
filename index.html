<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 标题字体：站酷快乐体 -->
<link href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-kuaile/index.css" rel="stylesheet">
<!-- 优雅文艺正文字体：霞鹜文楷 (LXGW WenKai Screen) -->
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.1.0/style.css" rel="stylesheet">
<title>🐱 猫猫游戏屋 · 灵猫手账绘本</title>
<style>
:root {
  /* 彩铅深绿体系 (更深、沉稳浓郁、天然矿物草木感) */
  --green-deep: #3C5435;
  --green: #527448;
  --green-mid: #6E9362;
  --green-soft: #9CB893;
  --green-light: #C7DAC1;
  --green-pale: #E4EEE0;

  /* 彩铅深粉体系 (更深、复古玫瑰/浓郁豆沙粉、彩铅蜡质厚重感) */
  --pink-deep: #883446;
  --pink: #A6475C;
  --pink-mid: #BF6277;
  --pink-soft: #D98E9E;
  --pink-light: #EDB8C3;
  --pink-pale: #F7DDE3;

  /* 辅助莫兰迪紫与珍珠 */
  --purple-deep: #58445E;
  --purple-mid: #846F8C;
  --purple-bow: #947E9C;
  --purple-light: #E7DEEC;

  --pearl-pure: #FFFFFF;
  --pearl-cream: #FAF6EF;
  --pearl-border: #C8BAA9;
  --gold: #CDB996;
  --gold-warm: #DFC99E;

  --ink: #3D353F;
  --ink-soft: #5C525E;
  --ink-light: #837885;
  --ink-faint: #B0A5B2;

  --shadow-book: 0 20px 48px -10px rgba(60, 84, 53, 0.22), 0 8px 18px rgba(136, 52, 70, 0.14);
  --shadow-page: 0 10px 25px rgba(60, 84, 53, 0.12);

  --font-display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-reading: "LXGW WenKai Screen", "LXGW WenKai", "STKaiti", "KaiTi", "PingFang SC", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden !important; /* 彻底杜绝上下滚动 */
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-ui);
  /* 1:1 复刻莫兰迪绿粉和纸水彩背景图，叠加浅米白半透明遮罩使其柔和退到后方 */
  background:
    linear-gradient(rgba(250, 246, 242, 0.42), rgba(250, 246, 242, 0.42)),
    #EAE3DA url('assets/bg.jpg') no-repeat center center fixed;
  background-size: auto, cover;
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  padding: 0;
}

/* 和纸柔光微质感层 (无浮空杂乱配饰，干净聚焦) */
.paper-ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.paper-grain {
  position: absolute;
  inset: -20px;
  opacity: 0.15;
  background-image: radial-gradient(rgba(61, 53, 63, 0.12) 1.2px, transparent 1.2px);
  background-size: 18px 18px;
}

#dustCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

/* ================= 顶层包装容器 (100vh 严格零滚动锁，最大化书本可视区域) ================= */
.wrap {
  width: 100%;
  max-width: clamp(960px, 98vw, 1320px);
  height: 100vh;
  height: 100dvh;
  max-height: 100dvh;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: clamp(2px, 0.6vh, 6px) clamp(6px, 1.2vw, 16px) clamp(3px, 0.8vh, 8px);
  box-sizing: border-box;
  overflow: hidden;
}

/* 顶部标题与萌宠吉祥物 (轻巧精美，释放最大垂直空间) */
header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-shrink: 0;
  margin-bottom: 2px;
}

.mascot-wrap {
  width: clamp(44px, 5.8vh, 62px);
  height: auto;
  cursor: pointer;
  filter: drop-shadow(0 4px 10px rgba(60, 84, 53, 0.18));
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.mascot-wrap:hover {
  transform: translateY(-3px) rotate(4deg);
}

.header-main-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

header h1 {
  font-family: var(--font-display);
  font-size: clamp(28px, 3.8vh, 38px);
  font-weight: 900;
  letter-spacing: 3.5px;
  color: var(--ink);
  text-shadow: 2px 2px 0 var(--pink-light), 0 3px 10px rgba(136, 52, 70, 0.15);
  transform: rotate(-0.8deg);
  line-height: 1.12;
  margin: 0;
}

.header-sub-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-sub {
  font-family: var(--font-reading);
  font-size: clamp(11px, 1.35vh, 12.5px);
  color: var(--green-deep);
  letter-spacing: 1.5px;
  margin: 0;
  text-align: center;
}

/* 实时灵猫状态牌 */
.cat-live-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 253, 249, 0.94);
  border: 1.2px solid var(--green-soft);
  border-radius: 999px;
  padding: 1.5px 9px;
  font-family: var(--font-reading);
  font-size: 11px;
  color: var(--green-deep);
  text-decoration: none;
  box-shadow: 0 2px 6px rgba(112, 138, 102, 0.12);
  transition: all 0.2s ease;
}

.cat-live-status-pill:hover {
  border-color: var(--green);
  background: #FFF;
  transform: translateY(-1px);
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #708A66;
  box-shadow: 0 0 6px rgba(112, 138, 102, 0.8);
  animation: pulseDot 2s ease-in-out infinite alternate;
}
@keyframes pulseDot {
  0% { transform: scale(0.85); opacity: 0.7; }
  100% { transform: scale(1.2); opacity: 1; }
}

/* ================= 侧边可移动灵猫伴侣 ================= */
.floating-companion-cat {
  position: fixed;
  right: clamp(14px, 2.5vw, 36px);
  bottom: clamp(10px, 2vh, 24px);
  width: clamp(88px, 11vh, 116px);
  height: clamp(124px, 15.5vh, 164px);
  z-index: 95;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  filter: drop-shadow(0 10px 22px rgba(60, 84, 53, 0.26));
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.floating-companion-cat:active,
.floating-companion-cat.dragging {
  cursor: grabbing;
  transform: scale(1.08) translateY(-4px);
  filter: drop-shadow(0 14px 26px rgba(136, 52, 70, 0.35));
  transition: none;
}

.cat-drag-hint {
  position: absolute;
  top: -24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 253, 249, 0.96);
  border: 1.2px solid var(--pink-soft);
  border-radius: 999px;
  padding: 1px 9px;
  font-family: var(--font-reading);
  font-size: 11px;
  color: var(--pink-deep);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.22s ease;
  box-shadow: 0 2px 6px rgba(136, 52, 70, 0.12);
}

.floating-companion-cat:hover .cat-drag-hint {
  opacity: 1;
}

.cat-sprite-wrapper {
  width: 100%;
  height: 100%;
  transform-origin: bottom center;
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.cat-shadow {
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 64px;
  height: 10px;
  background: radial-gradient(ellipse at center, rgba(60, 84, 53, 0.30) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.cat-thought-bubble {
  position: absolute;
  bottom: 108%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: rgba(255, 253, 249, 0.98);
  border: 1.8px solid var(--pink-soft);
  border-radius: 16px 16px 16px 3px;
  padding: 6px 13px;
  font-family: var(--font-reading);
  font-size: 12.5px;
  line-height: 1.45;
  color: #7D515D;
  box-shadow: 0 4px 14px rgba(136, 52, 70, 0.16);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 99;
}

.cat-thought-bubble.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.cat-thought-bubble::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 14px;
  border-width: 6px 6px 0;
  border-style: solid;
  border-color: rgba(255, 253, 249, 0.98) transparent;
}

/* ================= 3D 绿色横向翻开手账书 (最大化放大比例，舒展容纳左右功能页) ================= */
.book-stage {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 0;
}

.book-container {
  width: 100%;
  max-width: clamp(920px, 96vw, 1260px);
  aspect-ratio: 1024 / 576;
  max-height: 100%;
  background: transparent url('assets/green_book_empty.png') no-repeat center center;
  background-size: 100% 100%;
  display: flex;
  position: relative;
  overflow: hidden;
  filter: drop-shadow(0 16px 40px rgba(45, 68, 38, 0.30));
}

/* 左右两侧书页 (精准对应书页手账纸张可视区域) */
.book-page {
  position: relative;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.book-page.left {
  width: 50%;
  padding: clamp(14px, 4.2%, 26px) clamp(12px, 3.8%, 24px) clamp(14px, 4.8%, 26px) clamp(22px, 8.2%, 46px);
}

.book-page.right {
  width: 50%;
  padding: clamp(36px, 11%, 62px) clamp(22px, 8.2%, 46px) clamp(16px, 4.5%, 26px) clamp(14px, 4.2%, 26px);
}

/* ================= 左页：灵猫温馨小屋外貌与房间列表 ================= */
.house-map-header {
  margin-bottom: 4px;
}

.house-title {
  font-family: var(--font-display);
  font-size: clamp(16px, 2.5vh, 21px);
  letter-spacing: 2px;
  color: #3C5435;
  display: flex;
  align-items: center;
  gap: 6px;
}

.house-tip {
  font-family: var(--font-reading);
  font-size: clamp(11.5px, 1.45vh, 13px);
  color: #5A784F;
  margin-top: 1px;
}

/* 手绘小屋切面图 (舒展自适应填满左页纸张) */
.cozy-house-svg {
  width: 100%;
  flex: 1;
  min-height: 0;
  max-height: 100%;
  margin: auto 0;
  display: block;
}

.house-room {
  cursor: pointer;
  transition: all 0.22s ease;
}

.house-room:hover rect,
.house-room:hover path.room-bg,
.house-room:hover polygon.room-bg {
  fill: #FFF7E6 !important;
  stroke: #5A784F !important;
  stroke-width: 2px !important;
  filter: drop-shadow(0 0 8px rgba(90, 120, 79, 0.5));
}

.house-room.active rect,
.house-room.active path.room-bg,
.house-room.active polygon.room-bg {
  fill: #FFFDF0 !important;
  stroke: #3C5435 !important;
  stroke-width: 2.2px !important;
  filter: drop-shadow(0 0 10px rgba(60, 84, 53, 0.6));
}

.house-room text {
  font-family: var(--font-reading);
  font-weight: 700;
  font-size: 11.5px;
  fill: var(--ink);
  pointer-events: none;
}

/* ================= 右页：章节展示台与手账卡 ================= */
.chapter-container {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  animation: pageFadeIn 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
}

@keyframes pageFadeIn {
  from { opacity: 0; transform: translateX(8px) scale(0.98); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

.chapter-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}

.chapter-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #E8EFE5;
  border: 1.2px solid #B8CDAF;
  border-radius: 999px;
  padding: 2px 10px;
  font-family: var(--font-display);
  font-size: clamp(11.5px, 1.35vh, 12.5px);
  color: #3C5435;
  letter-spacing: 1px;
}

.chapter-number {
  font-family: var(--font-display);
  font-size: clamp(12.5px, 1.45vh, 13.5px);
  color: #5A784F;
  letter-spacing: 1.5px;
}

/* 篇章内容卡片 (等比精简缩小并居中偏下摆放) */
.polaroid-card {
  background: rgba(255, 253, 249, 0.88);
  border: 1.5px solid #D6CABA;
  border-radius: 14px;
  padding: clamp(10px, 1.5vh, 16px) clamp(12px, 1.8vw, 18px);
  box-shadow: 0 4px 12px rgba(60, 84, 53, 0.08);
  display: flex;
  flex-direction: column;
  gap: clamp(4px, 0.8vh, 7px);
  margin: 1px 0;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.polaroid-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(60, 84, 53, 0.14);
}

.polaroid-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.polaroid-icon-box {
  width: clamp(38px, 4.8vh, 44px);
  height: clamp(38px, 4.8vh, 44px);
  border-radius: 12px;
  background: #FAF4EB;
  border: 1.4px solid #D6CABA;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
}

.polaroid-icon-svg {
  width: 26px;
  height: 26px;
  filter: drop-shadow(0 2px 3px rgba(60, 84, 53, 0.15));
}

.polaroid-title-wrap h2 {
  font-family: var(--font-display);
  font-size: clamp(18px, 2.4vh, 22px);
  letter-spacing: 1.5px;
  color: #3C5435;
  margin: 0;
  line-height: 1.15;
}

.polaroid-tagline {
  font-family: var(--font-reading);
  font-size: clamp(11.5px, 1.35vh, 12.5px);
  color: #5A784F;
  margin-top: 1px;
}

.polaroid-desc {
  font-family: var(--font-reading);
  font-size: clamp(11.5px, 1.45vh, 13px);
  line-height: 1.62;
  color: #4A4048;
  letter-spacing: 0.02em;
  padding: 1px 0;
  margin: 0;
}

.polaroid-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 1px;
}

.p-tag {
  font-family: var(--font-reading);
  font-size: clamp(10.5px, 1.25vh, 11.5px);
  padding: 1.5px 8px;
  border-radius: 999px;
  background: #EFE8DC;
  border: 1px solid #D6CABA;
  color: #5F4A39;
}

/* 翻开开玩书签大按钮 */
.action-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 2px;
}

.play-bookmark-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #789E68;
  border: 1.8px solid #5A784F;
  border-radius: 999px;
  padding: clamp(5px, 0.85vh, 7px) clamp(14px, 1.8vw, 20px);
  font-family: var(--font-display);
  font-size: clamp(13px, 1.55vh, 14.5px);
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #FFFDF9;
  text-decoration: none;
  box-shadow: 0 3px 10px rgba(60, 84, 53, 0.22);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.play-bookmark-btn:hover {
  transform: translateY(-2px) scale(1.02);
  background: #6A8E5B;
  box-shadow: 0 5px 14px rgba(60, 84, 53, 0.32);
}

.play-bookmark-btn:active {
  transform: translateY(1px) scale(0.98);
}

.play-btn-ico {
  width: 16px;
  height: 16px;
}

/* ================= 底部翻页控制器 ================= */
.book-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-top: 2px;
}

.nav-arrow-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--paper-cream);
  background: var(--bg-card);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(107, 94, 94, 0.1);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.nav-arrow-btn:hover {
  transform: translateY(-2px) scale(1.08);
  border-color: var(--green);
  color: var(--green-deep);
  box-shadow: 0 6px 14px rgba(112, 138, 102, 0.22);
}

.nav-arrow-btn:active {
  transform: translateY(1px) scale(0.96);
}

.nav-arrow-btn svg {
  width: 20px;
  height: 20px;
}

.nav-dots {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #DFD5CD;
  cursor: pointer;
  transition: all 0.25s ease;
}

.nav-dot.active {
  width: 24px;
  border-radius: 999px;
  background: var(--green);
  box-shadow: 0 0 6px rgba(163, 184, 153, 0.6);
}

footer {
  margin-top: 24px;
  font-family: var(--font-reading);
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 2px;
}

/* ================= 灵猫大厅自主漫步生命系统 (Living Companion) ================= */
.roaming-cat-stage {
  width: 100%;
  max-width: 900px;
  margin: 6px auto 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 15;
}

/* 实时灵猫状态牌 */
.cat-live-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255, 253, 249, 0.94);
  border: 1.5px solid var(--green-soft);
  border-radius: 999px;
  padding: 4px 14px 4px 10px;
  font-family: var(--font-reading);
  font-size: 12px;
  color: var(--green-deep);
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(112, 138, 102, 0.12);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  margin-bottom: 6px;
  transition: all 0.2s ease;
}

.cat-live-status-pill:hover {
  border-color: var(--green);
  background: #FFF;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(112, 138, 102, 0.22);
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #708A66;
  box-shadow: 0 0 6px rgba(112, 138, 102, 0.8);
  animation: pulseDot 2s ease-in-out infinite alternate;
}
@keyframes pulseDot {
  0% { transform: scale(0.85); opacity: 0.7; }
  100% { transform: scale(1.2); opacity: 1; }
}

/* 漫步跑道（横贯在书本上方，适配长颈猫优雅身形） */
.roaming-track {
  width: 100%;
  height: 125px;
  position: relative;
  overflow: visible;
}

/* 灵猫实体精灵 */
.roaming-cat-actor {
  position: absolute;
  bottom: 6px;
  left: 50%;
  width: 88px;
  height: 124px;
  cursor: pointer;
  z-index: 20;
  transform-origin: bottom center;
  transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
  user-select: none;
}

.roaming-cat-actor:active {
  transform: scale(0.94);
}

/* 专为长颈猫身体图形准备的独立转向容器 (scaleX 仅作用于此，绝对不波及头顶气泡) */
.cat-sprite-wrapper {
  width: 100%;
  height: 100%;
  transform-origin: bottom center;

}

@keyframes floatTrinket {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(-5px) rotate(3deg); }
}

  position: fixed;
  font-size: 18px;

/* ================= 翻页与和弦合成音 (Web Audio) ================= */
let AC = null;
function ensureAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended") AC.resume();
  return AC;
}

function playPageTurnSound() {
  try {
    const a = ensureAC();
    const t = a.currentTime;
    // 纸张翻折的沙沙白噪滤波声 + 水晶微音
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(320 + Math.random() * 80, t);
    osc.frequency.exponentialRampToValueAtTime(140, t + 0.16);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    osc.connect(gain).connect(a.destination);
    osc.start();
    osc.stop(t + 0.18);
  } catch (e) {}
}

function playPurrSound() {
  try {
    const a = ensureAC();
    const t = a.currentTime;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(110, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.08, t + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(gain).connect(a.destination);
    osc.start();
    osc.stop(t + 0.5);
  } catch (e) {}
}

/* ================= 漂浮金粉背景粒子 ================= */
const dustCanvas = document.getElementById("dustCanvas");
const ctx = dustCanvas.getContext("2d");
let particles = [];

function resizeCanvas() {
  dustCanvas.width = window.innerWidth;
  dustCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

for (let i = 0; i < 24; i++) {
  particles.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: 1 + Math.random() * 1.8,
    speedY: -0.15 - Math.random() * 0.25,
    speedX: (Math.random() - 0.5) * 0.2,
    alpha: 0.2 + Math.random() * 0.5,
    pulse: Math.random() * Math.PI
  });
}

function renderDust() {
  ctx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
  particles.forEach(p => {
    p.y += p.speedY;
    p.x += p.speedX;
    p.pulse += 0.03;
    const a = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));

    if (p.y < -10) { p.y = dustCanvas.height + 10; p.x = Math.random() * dustCanvas.width; }
    if (p.x < -10) p.x = dustCanvas.width + 10;
    if (p.x > dustCanvas.width + 10) p.x = -10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(226, 207, 168, ${a})`;
    ctx.fill();
  });
  requestAnimationFrame(renderDust);
}
renderDust();

// 状态机与物理移动
let currentPose = "sit";
let isWalking = false;
let facing = 1;
let thoughtTimer = null;
let zzzTimer = null;

function setPose(pose) {
  currentPose = pose;
  if (catSpriteSvg) catSpriteSvg.innerHTML = getCatPoseSVG(pose);

  // 打盹时冒 Zzz
  clearInterval(zzzTimer);
  if (pose === "loaf") {
    zzzTimer = setInterval(() => {
      const z = document.createElement("div");
      z.className = "zzz-mote";
      z.textContent = "Zzz";
      z.style.left = "28px";
      z.style.top = "-10px";
      if (floatingCat) floatingCat.appendChild(z);
      setTimeout(() => z.remove(), 2200);
    }, 1200);
  }
}

function showThought(text, duration = 3800) {
  if (!thoughtText || !catThoughtBubble) return;
  thoughtText.textContent = text;
  catThoughtBubble.classList.add("show");
  clearTimeout(thoughtTimer);
  thoughtTimer = setTimeout(() => {
    catThoughtBubble.classList.remove("show");
  }, duration);
}

// 触摸 / 点击灵猫交互
function petCat(e) {
  isWalking = false;
  setPose("happy");
  playPurrSound();

  const lines = THOUGHTS.happy.concat([
    "喵呜～摸到心坎里去啦！",
    "耳朵抖一抖，烦恼全带走～",
    "有珠珠在，每天都是最棒的探险！"
  ]);
  showThought(lines[Math.floor(Math.random() * lines.length)], 3500);

  // 爆发粉红小爱心粒子
  const rect = floatingCat.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + 30;

  for (let i = 0; i < 4; i++) {
    const heart = document.createElement("div");
    heart.className = "heart-pop";
    heart.textContent = Math.random() < 0.6 ? "💖" : "✨";
    heart.style.left = cx + "px";
    heart.style.top = cy + "px";
    heart.style.setProperty("--dx", `${(Math.random() - 0.5) * 50}px`);
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 800);
  }

  // 2.2秒后如果没继续摸，恢复坐姿
  clearTimeout(floatingCat._resetTimer);
  floatingCat._resetTimer = setTimeout(() => {
    if (currentPose === "happy") setPose("sit");
  }, 2200);
}

// 自由拖拽与移动系统 (鼠标 + 触摸全支持，随心摆放在任意旁边位置)
(function initDraggableCat() {
  if (!floatingCat) return;

  let isDragging = false;
  let startX = 0, startY = 0;
  let initLeft = 0, initTop = 0;
  let hasMoved = false;

  floatingCat.addEventListener("pointerdown", e => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    isDragging = true;
    hasMoved = false;
    floatingCat.classList.add("dragging");
    try { floatingCat.setPointerCapture(e.pointerId); } catch (_) {}

    const rect = floatingCat.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    initLeft = rect.left;
    initTop = rect.top;
  });

  floatingCat.addEventListener("pointermove", e => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      hasMoved = true;
    }

    let newX = initLeft + dx;
    let newY = initTop + dy;

    // 视口边界限制，保证猫猫不越界
    const maxX = window.innerWidth - floatingCat.offsetWidth - 6;
    const maxY = window.innerHeight - floatingCat.offsetHeight - 6;
    newX = Math.max(6, Math.min(newX, maxX));
    newY = Math.max(6, Math.min(newY, maxY));

    floatingCat.style.left = `${newX}px`;
    floatingCat.style.top = `${newY}px`;
    floatingCat.style.right = "auto";
    floatingCat.style.bottom = "auto";
  });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    floatingCat.classList.remove("dragging");
    try { floatingCat.releasePointerCapture(e.pointerId); } catch (_) {}
  }

  floatingCat.addEventListener("pointerup", e => {
    endDrag(e);
    if (!hasMoved) {
      petCat(e);
    }
  });

  floatingCat.addEventListener("pointercancel", endDrag);
})();

// 侧边自主微漫步调度器 (侧边活动，绝不遮挡中间核心内容)
function scheduleCatAction() {
  const delay = 3500 + Math.random() * 4000;

  setTimeout(() => {
    const r = Math.random();

    if (r < 0.35) {
      // 侧边小步踱步与转身
      facing = facing === 1 ? -1 : 1;
      if (catSpriteWrapper) catSpriteWrapper.style.transform = `scaleX(${facing})`;
      setPose("walk");
      setTimeout(() => {
        setPose("sit");
        if (Math.random() < 0.4) {
          const list = THOUGHTS.general;
          showThought(list[Math.floor(Math.random() * list.length)]);
        }
        scheduleCatAction();
      }, 1200);
    } else if (r < 0.62) {
      // 端坐并自言自语
      setPose("sit");
      const list = THOUGHTS.general;
      showThought(list[Math.floor(Math.random() * list.length)]);
      scheduleCatAction();
    } else if (r < 0.82) {
      // 洗脸抹爪或伸懒腰
      const pose = Math.random() < 0.5 ? "groom" : "stretch";
      setPose(pose);
      const list = THOUGHTS[pose];
      showThought(list[Math.floor(Math.random() * list.length)]);
      scheduleCatAction();
    } else {
      // 农民揣打盹
      setPose("loaf");
      showThought(THOUGHTS.loaf[Math.floor(Math.random() * THOUGHTS.loaf.length)], 4500);
      scheduleCatAction();
    }
  }, delay);
}

// 柔和呼噜声与水晶和弦合成 (Web Audio)
function playPurrSound() {
  try {
    const a = ensureAC();
    const t = a.currentTime;
    // 呼噜柔频基波
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.linearRampToValueAtTime(165, t + 0.15);
    osc.frequency.exponentialRampToValueAtTime(120, t + 0.35);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.2, t + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    osc.connect(gain).connect(a.destination);
    osc.start();
    osc.stop(t + 0.4);

    // 水晶高音和弦
    const osc2 = a.createOscillator();
    const gain2 = a.createGain();
    osc2.type = "triangle";
    osc2.frequency.setValueAtTime(523.25, t); // C5
    osc2.frequency.exponentialRampToValueAtTime(659.25, t + 0.2); // E5
    gain2.gain.setValueAtTime(0.0001, t);
    gain2.gain.linearRampToValueAtTime(0.12, t + 0.03);
    gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    osc2.connect(gain2).connect(a.destination);
    osc2.start();
    osc2.stop(t + 0.42);
  } catch (e) {}
}

// 同步日记小屋中的灵猫真实成长与心情
function syncCatHouseStatus() {
  try {
    const raw = localStorage.getItem("zz-cat-house-v2") || localStorage.getItem("zz-cat-house");
    if (raw) {
      const data = JSON.parse(raw);
      const mood = typeof data.mood === "number" ? data.mood : 85;
      const energy = typeof data.energy === "number" ? data.energy : 30;

      let moodText = "元气依恋";
      if (mood >= 90) moodText = "极度幸福 · 撒娇求抱";
      else if (mood >= 70) moodText = "依恋温存 · 安适闲逛";
      else if (mood >= 50) moodText = "平和宁静 · 享受陪伴";
      else moodText = "渴望抚摸 · 寻求安慰";

      catLiveStatus.textContent = `灵猫 · ${moodText} (幸福度 ${mood}%)`;
    }
  } catch (e) {}
}
